# data/items.toml — everyday things people measure against.
#
# Hand-written. Every entity cites where its numbers come from; where a
# standard gives a range, the midpoint is used and the source says so. Values
# that could not be checked against a source were left out rather than
# guessed. Foods are generated separately (data/food.toml, from USDA).
#
#   domain  groups references so the "for scale" pod does not compare a
#           result to two things of the same sort
#   scale   properties this entity lends to the "for scale" pod
#
# See data/properties.toml for property names, and cairn item 0032.

