# data/units.toml — every unit tungsten knows.
#
# Compiled into the binary by crates/units/build.rs, which fails the build on a
# missing source, an unknown system, or two units answering to the same name.
# Definitions are resolved and checked by `cargo test -p tungsten-units`.
#
# [[prefix]]  symbol, name, factor, kind ("si" | "binary"), aliases, source
#
# [[unit]]
#   names     long names; matched case-insensitively. First is canonical.
#   plurals   optional; defaults to each name + "s" (or "es"/"ies" by spelling)
#   symbols   matched case-sensitively. First is the display symbol unless
#             `display` is given.
#   base      a base dimension (with optional `scale`), or
#   def       an expression in other units: "0.3048 m", "kg m/s^2", "pi/180 rad"
#   offset    affine units only: the kelvin value of this scale's zero
#   delta     affine units only: symbol of the matching difference unit
#   prefixes  "si", "binary", "si binary", "large", or explicit symbols "k M G"
#   expand    true for compound units (mph = mi/h) that may be expanded so
#             terms cancel: mph × h → mi
#   system    si | metric | imperial | us | nautical | astronomical |
#             information | physics | other
#   source    where the definition comes from. Required.
#
# [[quantity]] names a dimension and lists the units offered in the
# "other units" pod. `groups` each contribute their best candidate; `extra`
# groups are consulted only when the result is already in one of their units.

# ─── Sources ─────────────────────────────────────────────────────────────────
# BIPM    The International System of Units (SI Brochure), 9th ed., 2019, v3.01 (2024)
# CGPM22  27th CGPM (2022), Resolution 3: prefixes ronna, quetta, ronto, quecto
# SP811   NIST Special Publication 811 (2008), Guide for the Use of the SI, App. B
# HB44    NIST Handbook 44 (2024), Appendix C: General Tables of Units of Measurement
# IEC     IEC 80000-13:2008, Quantities and units — Information science and technology
# IAU     IAU 2012 Resolution B2 (astronomical unit); IAU Style Manual (light year)
# ISO     ISO 80000-3:2019 (time, angle)
# WMA     UK Weights and Measures Act 1985, Schedule 1 (imperial units)

