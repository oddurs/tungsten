# ─── SI base units ───────────────────────────────────────────────────────────

[[unit]]
names = ["metre", "meter"]
symbols = ["m"]
base = "length"
prefixes = "si"
system = "si"
source = "BIPM §2.3.1, Table 2"

[[unit]]
names = ["gram", "gramme"]
symbols = ["g"]
base = "mass"
scale = "0.001"
prefixes = "si"
system = "si"
source = "BIPM §2.3.1, Table 2 (kilogram is the base unit; prefixes attach to gram, §3)"

[[unit]]
names = ["second"]
plurals = ["seconds", "secs"]
symbols = ["s", "sec"]
base = "time"
prefixes = "si"
system = "si"
source = "BIPM §2.3.1, Table 2"

[[unit]]
names = ["ampere", "amp"]
symbols = ["A"]
base = "current"
prefixes = "si"
system = "si"
source = "BIPM §2.3.1, Table 2"

[[unit]]
names = ["kelvin"]
plurals = ["kelvins", "kelvin"]
symbols = ["K"]
base = "temperature"
prefixes = "si"
system = "si"
source = "BIPM §2.3.1, Table 2"

[[unit]]
names = ["mole"]
symbols = ["mol"]
base = "amount"
prefixes = "si"
system = "si"
source = "BIPM §2.3.1, Table 2"

[[unit]]
names = ["candela"]
symbols = ["cd"]
base = "luminosity"
prefixes = "si"
system = "si"
source = "BIPM §2.3.1, Table 2"

