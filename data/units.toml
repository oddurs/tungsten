# ─── Temperature scales and differences ──────────────────────────────────────

[[unit]]
names = ["degree fahrenheit", "fahrenheit"]
plurals = ["degrees fahrenheit"]
symbols = ["°F", "℉", "degF"]
def = "5/9 K"
offset = "45967/180"
delta = "Δ°F"
system = "us"
source = "SP811 B.8 (t/°F = 1.8 t/°C + 32)"

[[unit]]
names = ["degree rankine", "rankine"]
plurals = ["degrees rankine"]
symbols = ["°R", "degR"]
def = "5/9 K"
system = "us"
source = "SP811 B.8"

[[unit]]
names = ["celsius degree", "delta celsius"]
plurals = ["celsius degrees"]
symbols = ["Δ°C", "ΔC"]
def = "K"
system = "si"
source = "BIPM §2.3.1 (a difference of 1 °C equals 1 K)"

[[unit]]
names = ["fahrenheit degree", "delta fahrenheit"]
plurals = ["fahrenheit degrees"]
symbols = ["Δ°F", "ΔF"]
def = "5/9 K"
system = "us"
source = "SP811 B.8"

