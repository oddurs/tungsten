# One quiet job. Local `scripts/check` is the gate on every PR; this re-runs it
# on Linux after merging, as a safety net. It never blocks anything.
name: main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: curl -fsSL https://raw.githubusercontent.com/oddurs/cairn/main/install.sh | sh
      - run: PATH="$HOME/.local/bin:$PATH" scripts/check
