# One quiet job. Local `scripts/check` is the gate on every PR; this re-runs it
# on Linux after merging, as a safety net: build, clippy, tests. It never
# blocks anything.
name: main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check
